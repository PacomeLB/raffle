[profile.default]
src = "src"
out = "out"
libs = ["lib"]
auto_detect_remappings = true
optimizer = true
optimizer_runs = 200
via_ir = true

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options


[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
local = "${LOCAL_ANVIL_RPC_URL}"

[etherscan]
sepolia = { key = "${API_TOKEN_ETHERSCAN}" }

